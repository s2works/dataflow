name: Refresh NFL data

on:
  schedule:
    # Daily at 11:00 UTC, September through February (nflverse updates overnight).
    - cron: "0 11 * 9-12,1-2 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline/build_nfl.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- web/data; then
            echo "No data changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data
          git commit -m "Refresh NFL data"
          git push
