name: Refresh data

on:
  schedule:
    # Every 2 hours, September through June (NFL Sept-Feb, NHL Oct-June).
    # Each run also snapshots NFL betting lines, so this cadence is the
    # resolution of line-movement history.
    - cron: "17 */2 * 1-6,9-12 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-nfl-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python pipeline/build_nfl.py
        env:
          # Optional: player prop lines from The Odds API. Add the key under
          # Settings -> Secrets and variables -> Actions. Without it, props are skipped.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Hours before a game's props are re-pulled (each pull costs credits).
          PROPS_MIN_HOURS: ${{ vars.PROPS_MIN_HOURS || '12' }}
      - run: node tools/fit_prop_dist.mjs
      - run: node tools/fit_boom_bust.mjs
      - run: node tools/fit_game_model.mjs
      - run: python pipeline/build_nhl.py
      - run: node tools/nhl_backtest.mjs --fit
      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain -- web/data)" ]; then
            echo "No data changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data
          git commit -m "Refresh data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
