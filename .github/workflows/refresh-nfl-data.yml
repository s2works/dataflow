name: Refresh NFL data

on:
  schedule:
    # Every 2 hours, September through February. Each run also snapshots the
    # betting lines, so this cadence is the resolution of line-movement history.
    - cron: "17 */2 * 9-12,1-2 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-nfl-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline/build_nfl.py
      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain -- web/data)" ]; then
            echo "No data changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data
          git commit -m "Refresh NFL data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
